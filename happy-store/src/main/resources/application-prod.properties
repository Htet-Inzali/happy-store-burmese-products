spring.datasource.url=jdbc:postgresql://happystore-postgres-happystore-burmeseproduct.c.aivencloud.com:24786/defaultdb?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 🔐 JWT secret — env var မှသာ ရယူသည်။ default fallback မထားပါ
# (fallback ထားပါက env မရှိချိန်တွင် repo ထဲရှိ secret ဖြင့် တိတ်တဆိတ် run သွားပြီး token အတု ဖန်တီးခံရနိုင်သည်)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.upload.dir=uploads
app.cors.allowed-origins=https://happystoreburmeseproduct.vercel.app

# Cloudinary (ပုံများကို permanent storage တွင် သိမ်းရန် — Render restart တွင် မပျောက်စေရန်)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}