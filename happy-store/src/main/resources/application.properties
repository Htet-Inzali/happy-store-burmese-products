# ============================================================
# 📧 Email (Gmail SMTP) — password reset link ပို့ရန်
# Render env မှ MAIL_USERNAME (Gmail) + MAIL_PASSWORD (App Password) ထည့်ရန်။
# မထည့်ထားလျှင် reset email ပို့မရသော်လည်း startup မပျက်ပါ (silently skip)။
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@happystore.com}}

# Frontend URL — email ထဲ ထည့်ပို့မည့် reset link ဆောက်ရန်
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
